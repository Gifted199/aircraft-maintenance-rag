[project]
name = "aero-rag"
version = "0.1.0"
description = "Aircraft maintenance manual assistant: hybrid-search RAG on AWS (S3, OpenSearch, ECS Fargate) with Azure OpenAI."
requires-python = ">=3.12"
# Dependencies are added in the phase that first needs them (FastAPI in 3, Langfuse in 7).
# The Streamlit UI has its own image and ui/requirements.txt; the "ui" group below only lets it
# run locally with `uv run --group ui streamlit run ui/app.py`. It is not installed by `uv sync`
# by default and never goes into the API image.
dependencies = [
    "boto3>=1.35",
    "fastapi>=0.115",
    "openai>=1.60",
    "opensearch-py>=2.7",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
    "ruff>=0.7",
]
ui = [
    "streamlit==1.67.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aero_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts", "ui"]

[tool.ruff]
line-length = 100
src = ["src", "scripts", "tests", "ui"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
